<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAYOO</title>

    <!-- favicon -->
     <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

     <!-- taiwind + dasiyui -->
      <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

     <!-- icons -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
     <style>
        *{
            font-family: 'Geist', sans-serif;
        }
     </style>
</head>
<body class="px-[250px] mx-auto bg-[#F8FAFC]">

    <section class="py-[60px]">
        <div>
            <h1 class="font-bold text-3xl pb-5">
                Job Application Tracker
            </h1>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div class="p-5 bg-[#FFFFFF] rounded-lg shadow-md">
                <p class="font-medium text-[#323B49] pb-2">Total</p>
                <h2 class="font-bold text-2xl text-[#002C5C]">0</h2>
            </div>
            <div class="p-5 bg-[#FFFFFF] rounded-lg shadow-md">
                <p class="font-medium text-[#323B49] pb-2">Interview</p>
                <h2 class="font-bold text-2xl text-[#10B981]">0</h2>
            </div>
            <div class="p-5 bg-[#FFFFFF] rounded-lg shadow-md">
                <p class="font-medium text-[#323B49] pb-2">Rejected</p>
                <h2 class="font-bold text-2xl text-[#EF4444]">0</h2>
            </div>
        </div>
    </section>


    <section>
        <div>
            <div class="text-[#002C5C] font-semibold text-[22px] pb-6">
                <h2>Available Jobs</h2>
            </div>
            <div class="pb-4 space-x-2">
                <a href="index.html" class="btn btn-soft btn-info border-2 border-info">All</a>
                <a href="interviews.html" class="btn btn-soft btn-info border-2 border-info">Interview</a>
                <a href="rejected.html" class="btn btn-soft btn-info bg-info text-white">Rejected</a>
        </div>
    </section>

    <section>
        <div class="pb-50">
            <div class="bg-[#FFFFFF] rounded-lg shadow-md items-center justify-items-center text-center py-[121px]">
            <div>
                <img src="./jobs.png" alt="">
            </div>
            <div>
                <h2 class="font-semibold text-2xl text-[#002C5C] pt-5">No jobs available</h2>
                <p class="text-[#64748B] pt-1">Check back soon for new job opportunities</p>
            </div>
        </div>
        </div>
    </section>
</body>
</html>
